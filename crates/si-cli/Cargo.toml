[package]
name = "si-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "norn"
path = "src/main.rs"

[dependencies]
si-core = { path = "../si-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
rayon = "1"
mimalloc = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
